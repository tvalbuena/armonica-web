name: CI - Validación ARMÓNICA

on:
  push:
    branches: [ feature/ci-setup, main ]
  pull_request:
    branches: [ main ]

jobs:
  validar-html:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar validador HTML
        run: npm install -g html-validate

      - name: Validar index.html
        run: html-validate index.html

  validar-backend:
    name: Validar Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del backend
        run: |
          cd backend
          npm install

      - name: Verificar estructura del backend
        run: |
          test -f backend/index.js && echo "✅ index.js existe"
          test -f backend/package.json && echo "✅ package.json existe"