<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMÓNICA | Panel Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f4f5; }

        /* LOGIN */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(123,63,74,0.1);
        }
        .login-logo {
            color: #7B3F4A;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            color: #888;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .btn-login {
            background-color: #7B3F4A;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 500;
        }
        .btn-login:hover { background-color: #6a3540; color: white; }

        /* PANEL */
        .panel-container { display: none; }
        .navbar-admin {
            background-color: #7B3F4A;
            padding: 1rem 2rem;
        }
        .navbar-admin .navbar-brand {
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid white;
            color: white;
            border-radius: 8px;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
        }
        .btn-logout:hover { background: white; color: #7B3F4A; }
        .panel-content { padding: 2rem; }
        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            text-align: center;
        }
        .stats-number {
            font-size: 2rem;
            font-weight: 600;
            color: #7B3F4A;
        }
        .stats-label { color: #888; font-size: 0.85rem; }
        .table-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-top: 1.5rem;
        }
        .badge-pendiente { background-color: #FFF3CD; color: #856404; }
        .badge-confirmada { background-color: #D1E7DD; color: #0F5132; }
        .badge-cancelada { background-color: #F8D7DA; color: #842029; }
        .error-message { color: #dc3545; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <div class="login-logo">
                <i class="bi bi-flower1 me-2"></i>ARMÓNICA
            </div>
            <p class="login-subtitle">Panel de Administración</p>

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" id="inputUsuario" class="form-control" placeholder="Tu usuario">
                <div id="error-usuario" class="error-message"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="inputPassword" class="form-control" placeholder="Tu contraseña">
                <div id="error-password" class="error-message"></div>
            </div>

            <div id="error-login" class="error-message mb-3"></div>

            <button class="btn-login" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </button>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div class="panel-container" id="panelContainer">

        <nav class="navbar-admin d-flex justify-content-between align-items-center">
            <span class="navbar-brand">
                <i class="bi bi-flower1 me-2"></i>ARMÓNICA — Panel Admin
            </span>
            <button class="btn-logout" id="btnLogout">
                <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
            </button>
        </nav>

        <div class="panel-content">

            <!-- Estadísticas -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="stats-number" id="totalCitas">0</div>
                        <div class="stats-label">Total citas</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="stats-number" id="citasPendientes">0</div>
                        <div class="stats-label">Pendientes</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <div class="stats-number" id="citasConfirmadas">0</div>
                        <div class="stats-label">Confirmadas</div>
                    </div>
                </div>
            </div>

            <!-- Tabla de citas -->
            <div class="table-card">
                <h5 class="mb-3">Citas registradas</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Procedimiento</th>
                                <th>Fecha</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCitas">
                            <tr>
                                <td colspan="7" class="text-center text-muted">Cargando citas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
